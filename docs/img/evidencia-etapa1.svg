  <rect width="800" height="450" fill="#fffdf8"/>
  <rect x="20" y="20" width="760" height="410" rx="18" fill="none" stroke="#e2dccf" stroke-width="3"/>
  <text x="60" y="90" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1d2a22">Evidencia · Etapa 1</text>
  <text x="60" y="130" font-family="Georgia, serif" font-size="22" fill="#5d6b62">Compra de semillas y herramientas</text>
